<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="layout(title, content, activeMenu)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">NHMS - Quản Lý Viện Dưỡng Lão</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Application CSS -->
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<!-- Mobile sidebar backdrop overlay -->
<div id="sidebarOverlay" class="d-none position-fixed top-0 bottom-0 start-0 end-0 bg-dark bg-opacity-50" style="z-index: 1035;"></div>

<div class="app-layout">
    <!-- Sidebar Fragment -->
    <aside th:replace="~{fragments/sidebar :: sidebar(${activeMenu})}"></aside>

    <!-- Main Content Area -->
    <div class="app-main">
        <!-- Header Fragment -->
        <header th:replace="~{fragments/header :: header}"></header>

        <!-- Global Flash Messages -->
        <div class="container-fluid px-4 pt-3" th:if="${successMessage != null or errorMessage != null or infoMessage != null}">
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show d-flex align-items-center" role="alert">
                <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                <div th:text="${successMessage}">Thao tác thành công!</div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                <div th:text="${errorMessage}">Đã xảy ra lỗi, vui lòng kiểm tra lại!</div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${infoMessage}" class="alert alert-info alert-dismissible fade show d-flex align-items-center" role="alert">
                <i class="bi bi-info-circle-fill me-2 fs-5"></i>
                <div th:text="${infoMessage}">Thông báo hệ thống</div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        </div>

        <!-- Page Dynamic Body -->
        <main class="app-content">
            <div th:replace="${content}"></div>
        </main>

        <!-- Footer Fragment -->
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>

<!-- Bootstrap 5 Bundle JS -->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<!-- Custom App JS -->
<script th:src="@{/js/app.js}"></script>
</body>
</html>
