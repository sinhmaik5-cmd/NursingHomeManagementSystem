<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Tài khoản Người thân - NHMS Care</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        body.register-page {
            background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 50%, #f1f5f9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .register-card {
            max-width: 640px;
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }
        .register-header {
            background: linear-gradient(135deg, #0284c7 0%, #0d9488 100%);
            color: #ffffff;
            padding: 2rem;
            text-align: center;
            position: relative;
        }
        .register-logo-circle {
            width: 58px;
            height: 58px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin-bottom: 0.75rem;
        }
        .register-body {
            padding: 2rem 2.25rem;
        }
        .section-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #0284c7;
            background: #e0f2fe;
            padding: 0.3rem 0.75rem;
            border-radius: 20px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body class="register-page">


<div class="register-card">
    <!-- Header -->
    <div class="register-header" style="position: relative;">
        <!-- Nút Home quay về trang chủ -->
        <a th:href="@{/}" class="btn btn-sm btn-light text-primary position-absolute top-0 start-0 m-3 shadow-sm rounded-pill px-3 py-1 d-inline-flex align-items-center" style="font-size: 0.8rem; font-weight: 600; z-index: 10;" title="Quay về trang chủ NHMS Care">
            <i class="bi bi-house-door-fill me-1"></i>Trang Chủ
        </a>


        <div class="register-logo-circle">
            <i class="bi bi-people-fill"></i>
        </div>
        <h4 class="fw-bold mb-1">Đăng Ký Tài Khoản Người Thân</h4>
        <p class="mb-0 text-white-50 small">Cổng thông tin dành riêng cho gia đình & người bảo lãnh cư dân</p>
    </div>


    <!-- Body -->
    <div class="register-body">
        <!-- Error Alert -->
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center mb-3" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
            <div class="small" th:text="${errorMessage}">Đã xảy ra lỗi trong quá trình đăng ký.</div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>


        <form th:action="@{/register}" th:object="${registerRequest}" method="post" id="registerForm" novalidate>


            <!-- Phần 1: Thông tin người thân -->
            <div class="mb-4">
                <div class="section-badge">
                    <i class="bi bi-person-lines-fill"></i> 1. Thông Tin Người Thân (Người bảo lãnh)
                </div>


                <div class="row g-3">
                    <div class="col-md-7">
                        <label for="fullNameInput" class="form-label small fw-semibold text-muted">Họ và tên <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="fullNameInput" th:field="*{fullName}" placeholder="Ví dụ: Nguyễn Văn An" required>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                    </div>


                    <div class="col-md-5">
                        <label for="phoneInput" class="form-label small fw-semibold text-muted">Số điện thoại <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-telephone"></i></span>
                            <input type="tel" class="form-control" id="phoneInput" th:field="*{phoneNumber}" placeholder="VD: 0901234567" pattern="^(0|\+84)[35789]\d{8}$" title="Số điện thoại Việt Nam gồm 10 chữ số (bắt đầu bằng 03, 05, 07, 08, 09 hoặc +84)" required>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                    </div>


                    <div class="col-md-6">
                        <label for="relationshipInput" class="form-label small fw-semibold text-muted">Quan hệ với cư dân</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-heart"></i></span>
                            <select class="form-select" id="relationshipInput" th:field="*{relationship}">
                                <option value="Con trai">Con trai</option>
                                <option value="Con gái">Con gái</option>
                                <option value="Vợ / Chồng">Vợ / Chồng</option>
                                <option value="Anh / Chị / Em">Anh / Chị / Em</option>
                                <option value="Cháu">Cháu</option>
                                <option value="Người giám hộ">Người giám hộ</option>
                                <option value="Khác">Khác</option>
                            </select>
                        </div>
                    </div>


                    <div class="col-md-6">
                        <label for="emailInput" class="form-label small fw-semibold text-muted">Email (nhận hóa đơn & thông báo) <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="emailInput" th:field="*{email}" placeholder="example@gmail.com" required>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>


                    <div class="col-12">
                        <label for="addressInput" class="form-label small fw-semibold text-muted">Địa chỉ thường trú</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-geo-alt"></i></span>
                            <input type="text" class="form-control" id="addressInput" th:field="*{address}" placeholder="Số nhà, đường, quận/huyện, tỉnh/thành phố">
                        </div>
                    </div>
                </div>
            </div>


            <!-- Phần 2: Tài khoản đăng nhập -->
            <div class="mb-4">
                <div class="section-badge">
                    <i class="bi bi-shield-lock-fill"></i> 2. Thiết Lập Tài Khoản Đăng Nhập
                </div>


                <div class="row g-3">
                    <div class="col-12">
                        <label for="usernameInput" class="form-label small fw-semibold text-muted">Tên đăng nhập (Username) <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-at"></i></span>
                            <input type="text" class="form-control" id="usernameInput" th:field="*{username}" placeholder="Tối thiểu 3 ký tự (viết liền, không dấu)" required>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                    </div>


                    <div class="col-md-6">
                        <label for="passwordInput" class="form-label small fw-semibold text-muted">Mật khẩu <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="passwordInput" th:field="*{password}" placeholder="Tối thiểu 6 ký tự" required>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>


                    <div class="col-md-6">
                        <label for="confirmPasswordInput" class="form-label small fw-semibold text-muted">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-check2-circle"></i></span>
                            <input type="password" class="form-control" id="confirmPasswordInput" th:field="*{confirmPassword}" placeholder="Nhập lại mật khẩu" required>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                    </div>
                </div>
            </div>


            <!-- Nút Submit -->
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">
                <i class="bi bi-person-check-fill me-1"></i> Hoàn tất đăng ký tài khoản
            </button>


            <!-- Quay lại đăng nhập -->
            <div class="text-center">
                <span class="text-muted small">Đã có tài khoản trên hệ thống?</span>
                <a th:href="@{/login}" class="small fw-bold text-decoration-none text-primary ms-1">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập ngay
                </a>
            </div>
        </form>
    </div>
</div>


<!-- Bootstrap 5 Bundle JS -->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script>
    const form = document.getElementById('registerForm');
    form.addEventListener('submit', function (e) {
        const pwd = document.getElementById('passwordInput').value;
        const confirmPwd = document.getElementById('confirmPasswordInput').value;
        if (pwd !== confirmPwd) {
            e.preventDefault();
            alert('Mật khẩu xác nhận không khớp! Vui lòng kiểm tra lại.');
            document.getElementById('confirmPasswordInput').focus();
        }
    });
</script>
</body>
</html>
